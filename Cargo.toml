[workspace]
resolver = "2"
members = ["crates/ae-core", "crates/ae-render", "crates/ae-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/quangdang46/agent_eye"
authors = ["quangdang46"]
rust-version = "1.78"
description = "Agent-Eye converts pixels into deterministic visual evidence"

[workspace.dependencies]
ae-core = { path = "crates/ae-core" }
ae-render = { path = "crates/ae-render", default-features = false, features = ["cli"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-segmentation = "1.12"
owo-colors = "4.0"
anstyle = "1.0"
terminal_size = "0.4"
proptest = "1.6"
