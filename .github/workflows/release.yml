name: Release

# Cross-platform release pipeline (plan §10):
#   * binaries for x86_64-linux, x86_64-windows, aarch64-macos
#   * GitHub Release with checksums
#   * crates.io publish of ae-core, ae-render, ae-cli (workspace)
#
# Triggered by version tags: v0.1.0, v1.2.3 …

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ae-x86_64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ae-x86_64-windows
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: ae-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/ae${{ runner.os == 'Windows' && '.exe' || '' }}"
          "$BIN" --version | grep -q "^ae "
          "$BIN" capabilities | grep -q "agent-eye"
      - name: Package (tar.gz on unix, zip on windows)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/ae${{ runner.os == 'Windows' && '.exe' || '' }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BIN" "dist/ae.exe"
            cd dist && zip -q "../${{ matrix.artifact }}.zip" ae.exe && cd ..
          else
            cp "$BIN" "dist/ae"
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist ae
          fi
      - name: Checksums
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then sha256sum *.zip > SHA256SUMS; else shasum -a 256 *.tar.gz > SHA256SUMS; fi
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  github-release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  publish-crates:
    runs-on: ubuntu-latest
    needs: build
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Publish in dependency order
        run: |
          cargo publish -p ae-core --locked
          sleep 15 # registry index propagation before dependents
          cargo publish -p ae-render --locked --features cli
          sleep 15
          cargo publish -p ae-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
